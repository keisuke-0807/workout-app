<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f6bed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="筋トレ記録">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>筋トレ記録</title>
</head>
<body>
  <header class="topbar"><h1 id="title">筋トレ記録</h1><div id="actions" class="actions"></div></header>
  <main id="view"></main>
  <nav class="tabbar" aria-label="メニュー">
    <a href="#/" data-tab="cal">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      <span>カレンダー</span>
    </a>
    <a href="#/day/today" data-tab="day">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>
      <span>今日の記録</span>
    </a>
    <a href="#/stats" data-tab="stats">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16M7 16v-5M12 16V6M17 16v-8"/></svg>
      <span>集計</span>
    </a>
    <a href="#/settings" data-tab="settings">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      <span>設定</span>
    </a>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="updateBar" class="update-bar" role="status" hidden>
    <span>新しいバージョンがあります</span>
    <button type="button" class="btn primary small" id="updateNow">更新</button>
  </div>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
